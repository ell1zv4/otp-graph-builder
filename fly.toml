app = "otp-fiesta-bizkaifest"
primary_region = "mad"

[build]

[env]
  JAVA_OPTS = "-Xmx6G -XX:+UseG1GC"

[mounts]
  source = "otp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/"