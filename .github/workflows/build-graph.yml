name: Build OTP Graph

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "graph-source/**"
      - ".github/workflows/build-graph.yml"

jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OTP_URL: "https://repo1.maven.org/maven2/org/opentripplanner/otp/2.6.0/otp-2.6.0-shaded.jar"
      JAVA_OPTS: "-Xmx6G -XX:+UseG1GC"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download OTP jar
        run: |
          curl -L "$OTP_URL" -o otp.jar
          ls -lh otp.jar

      - name: Prepare directories
        run: |
          mkdir -p graph-source
          mkdir -p graph

      - name: Resolve latest GTFS + OSM
        env:
          API_KEY: ${{ secrets.NAP_API_KEY }}
        run: |
          set -euo pipefail
          python3 graph-source/resolve_gtfs_sources.py \
            --output-dir graph-source \
            --metadata-path graph-source/resolved-sources.json

          curl -L "https://download.geofabrik.de/europe/spain/pais-vasco-latest.osm.pbf" \
            -o "graph-source/pais-vasco-latest.osm.pbf"

          ls -lah graph-source
          cat graph-source/resolved-sources.json

      - name: Fix ALL GTFS (remove block_id)
        run: |
          set -euo pipefail
          cd graph-source

          for f in *.zip; do
            echo "Fixing $f"

            mkdir tmp_gtfs
            unzip -q "$f" -d tmp_gtfs

            if [ -f tmp_gtfs/trips.txt ]; then
              awk -F, 'BEGIN{OFS=","}
              NR==1{
                for(i=1;i<=NF;i++) if($i=="block_id") col=i
              }
              {
                if(col) $col=""
                print
              }' tmp_gtfs/trips.txt > tmp_gtfs/trips_fixed.txt

              mv tmp_gtfs/trips_fixed.txt tmp_gtfs/trips.txt
            fi

            cd tmp_gtfs
            zip -qr "../$f" .
            cd ..

            rm -rf tmp_gtfs
          done

      - name: Validate resolved sources
        run: |
          set -euo pipefail
          bash graph-source/validate_sources.sh

      - name: Resolve Moveuskadi realtime feeds
        run: |
          set -euo pipefail
          python3 graph-source/resolve_realtime_sources.py \
            --router-config graph-source/router-config.json \
            --metadata-path graph-source/resolved-realtime-sources.json
          cat graph-source/resolved-realtime-sources.json
          cat graph-source/router-config.json

      - name: Build OTP graph
        run: |
          set -euo pipefail
          echo "Building OTP graph..."
          ls -lah graph-source
          java $JAVA_OPTS -jar otp.jar --build --save graph-source

      - name: Verify graph artifact
        run: |
          set -euo pipefail
          test -s graph-source/graph.obj
          ls -lh graph-source/graph.obj

      - name: Smoke test built graph locally
        run: |
          set -euo pipefail

          java $JAVA_OPTS \
            -Dorg.opentripplanner.http.bindAddress=127.0.0.1 \
            -jar otp.jar \
            --load graph-source \
            --serve > otp-smoke.log 2>&1 &
          OTP_SERVER_PID=$!

          cleanup() {
            if kill -0 "$OTP_SERVER_PID" >/dev/null 2>&1; then
              kill "$OTP_SERVER_PID" >/dev/null 2>&1 || true
              wait "$OTP_SERVER_PID" >/dev/null 2>&1 || true
            fi
          }

          trap cleanup EXIT

          if ! python3 graph-source/smoke_test_otp.py --base-url http://127.0.0.1:8080; then
            cat otp-smoke.log
            exit 1
          fi

      - name: Upload graph artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: otp-graph-build
          if-no-files-found: ignore
          path: |
            graph-source/graph.obj
            graph-source/resolved-sources.json
            graph-source/resolved-realtime-sources.json
            graph-source/build-config.json
            otp-smoke.log
          retention-days: 30

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 89.167.73.244 >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host bizkaifest-vps
            HostName 89.167.73.244
            User root
            IdentityFile ~/.ssh/id_ed25519
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 15
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload candidate graph to VPS
        run: |
          set -euo pipefail
          ssh bizkaifest-vps "mkdir -p /opt/bizkaifest/graph"
          scp graph-source/graph.obj bizkaifest-vps:/opt/bizkaifest/graph/graph.obj.candidate
          scp graph-source/build-config.json bizkaifest-vps:/opt/bizkaifest/graph/build-config.json.candidate
          scp graph-source/router-config.json bizkaifest-vps:/opt/bizkaifest/graph/router-config.json.candidate
          scp graph-source/otp-config.json bizkaifest-vps:/opt/bizkaifest/graph/otp-config.json.candidate

      - name: Activate candidate graph with rollback
        run: |
          set -euo pipefail
          ssh bizkaifest-vps 'bash -s' <<'EOF'
          set -uo pipefail

          REMOTE_GRAPH_DIR="/opt/bizkaifest/graph"
          REMOTE_ACTIVE_GRAPH="$REMOTE_GRAPH_DIR/graph.obj"
          REMOTE_CANDIDATE_GRAPH="$REMOTE_GRAPH_DIR/graph.obj.candidate"
          REMOTE_BACKUP_GRAPH="$REMOTE_GRAPH_DIR/graph.obj.last-known-good"
          REMOTE_PREVIOUS_GRAPH="$REMOTE_GRAPH_DIR/graph.obj.previous"
          REMOTE_ACTIVE_BUILD_CONFIG="$REMOTE_GRAPH_DIR/build-config.json"
          REMOTE_CANDIDATE_BUILD_CONFIG="$REMOTE_GRAPH_DIR/build-config.json.candidate"
          REMOTE_BACKUP_BUILD_CONFIG="$REMOTE_GRAPH_DIR/build-config.json.last-known-good"
          REMOTE_PREVIOUS_BUILD_CONFIG="$REMOTE_GRAPH_DIR/build-config.json.previous"
          REMOTE_ACTIVE_ROUTER_CONFIG="$REMOTE_GRAPH_DIR/router-config.json"
          REMOTE_CANDIDATE_ROUTER_CONFIG="$REMOTE_GRAPH_DIR/router-config.json.candidate"
          REMOTE_BACKUP_ROUTER_CONFIG="$REMOTE_GRAPH_DIR/router-config.json.last-known-good"
          REMOTE_PREVIOUS_ROUTER_CONFIG="$REMOTE_GRAPH_DIR/router-config.json.previous"
          REMOTE_ACTIVE_OTP_CONFIG="$REMOTE_GRAPH_DIR/otp-config.json"
          REMOTE_CANDIDATE_OTP_CONFIG="$REMOTE_GRAPH_DIR/otp-config.json.candidate"
          REMOTE_BACKUP_OTP_CONFIG="$REMOTE_GRAPH_DIR/otp-config.json.last-known-good"
          REMOTE_PREVIOUS_OTP_CONFIG="$REMOTE_GRAPH_DIR/otp-config.json.previous"
          REMOTE_GRAPHQL_URL="http://127.0.0.1:8080/otp/gtfs/v1"
          REMOTE_GRAPHQL_PAYLOAD='{"query":"query SmokeStops($name: String!) { stops(name: $name) { name } }","variables":{"name":"Moyua"}}'

          mkdir -p "$REMOTE_GRAPH_DIR"
          test -s "$REMOTE_CANDIDATE_GRAPH"
          test -s "$REMOTE_CANDIDATE_BUILD_CONFIG"
          test -s "$REMOTE_CANDIDATE_ROUTER_CONFIG"
          test -s "$REMOTE_CANDIDATE_OTP_CONFIG"

          if [ -f "$REMOTE_ACTIVE_GRAPH" ]; then
            cp -f "$REMOTE_ACTIVE_GRAPH" "$REMOTE_PREVIOUS_GRAPH"
          fi
          if [ -f "$REMOTE_ACTIVE_BUILD_CONFIG" ]; then
            cp -f "$REMOTE_ACTIVE_BUILD_CONFIG" "$REMOTE_PREVIOUS_BUILD_CONFIG"
          fi
          if [ -f "$REMOTE_ACTIVE_ROUTER_CONFIG" ]; then
            cp -f "$REMOTE_ACTIVE_ROUTER_CONFIG" "$REMOTE_PREVIOUS_ROUTER_CONFIG"
          fi
          if [ -f "$REMOTE_ACTIVE_OTP_CONFIG" ]; then
            cp -f "$REMOTE_ACTIVE_OTP_CONFIG" "$REMOTE_PREVIOUS_OTP_CONFIG"
          fi

          activate_candidate() {
            local restart_exit=0
            mv -f "$REMOTE_CANDIDATE_GRAPH" "$REMOTE_ACTIVE_GRAPH"
            mv -f "$REMOTE_CANDIDATE_BUILD_CONFIG" "$REMOTE_ACTIVE_BUILD_CONFIG"
            mv -f "$REMOTE_CANDIDATE_ROUTER_CONFIG" "$REMOTE_ACTIVE_ROUTER_CONFIG"
            mv -f "$REMOTE_CANDIDATE_OTP_CONFIG" "$REMOTE_ACTIVE_OTP_CONFIG"
            systemctl restart otp || restart_exit=$?

            otp_is_ready() {
              local response=""
              systemctl is-active --quiet otp || return 1
              response="$(curl -fsS \
                -H "Content-Type: application/json" \
                -d "$REMOTE_GRAPHQL_PAYLOAD" \
                "$REMOTE_GRAPHQL_URL" 2>/dev/null || true)"
              test -n "$response" || return 1
              ! printf '%s' "$response" | grep -q '"errors"' || return 1
              printf '%s' "$response" | grep -q '"data"'
            }

            for attempt in $(seq 1 60); do
              echo "Waiting for OTP readiness (attempt ${attempt}/60)..."
              if otp_is_ready; then
                if [ "$restart_exit" -ne 0 ]; then
                  echo "OTP restart returned $restart_exit but the service recovered and answered GraphQL."
                fi
                cp -f "$REMOTE_ACTIVE_GRAPH" "$REMOTE_BACKUP_GRAPH"
                cp -f "$REMOTE_ACTIVE_BUILD_CONFIG" "$REMOTE_BACKUP_BUILD_CONFIG"
                cp -f "$REMOTE_ACTIVE_ROUTER_CONFIG" "$REMOTE_BACKUP_ROUTER_CONFIG"
                cp -f "$REMOTE_ACTIVE_OTP_CONFIG" "$REMOTE_BACKUP_OTP_CONFIG"
                rm -f "$REMOTE_PREVIOUS_GRAPH"
                rm -f "$REMOTE_PREVIOUS_BUILD_CONFIG"
                rm -f "$REMOTE_PREVIOUS_ROUTER_CONFIG"
                rm -f "$REMOTE_PREVIOUS_OTP_CONFIG"
                return 0
              fi
              sleep 5
            done

            if [ "$restart_exit" -ne 0 ]; then
              echo "systemctl restart otp returned $restart_exit and OTP never became ready." >&2
            fi
            return 1
          }

          if activate_candidate; then
            exit 0
          fi

          echo "OTP did not become healthy with the candidate graph." >&2
          if [ -f "$REMOTE_BACKUP_GRAPH" ]; then
            cp -f "$REMOTE_BACKUP_GRAPH" "$REMOTE_ACTIVE_GRAPH"
            cp -f "$REMOTE_BACKUP_BUILD_CONFIG" "$REMOTE_ACTIVE_BUILD_CONFIG"
            cp -f "$REMOTE_BACKUP_ROUTER_CONFIG" "$REMOTE_ACTIVE_ROUTER_CONFIG"
            cp -f "$REMOTE_BACKUP_OTP_CONFIG" "$REMOTE_ACTIVE_OTP_CONFIG"
          elif [ -f "$REMOTE_PREVIOUS_GRAPH" ]; then
            cp -f "$REMOTE_PREVIOUS_GRAPH" "$REMOTE_ACTIVE_GRAPH"
            cp -f "$REMOTE_PREVIOUS_BUILD_CONFIG" "$REMOTE_ACTIVE_BUILD_CONFIG"
            cp -f "$REMOTE_PREVIOUS_ROUTER_CONFIG" "$REMOTE_ACTIVE_ROUTER_CONFIG"
            cp -f "$REMOTE_PREVIOUS_OTP_CONFIG" "$REMOTE_ACTIVE_OTP_CONFIG"
          fi

          if [ -f "$REMOTE_ACTIVE_GRAPH" ]; then
            systemctl restart otp || true
          fi

          journalctl -u otp -n 80 --no-pager || true
          exit 1
          EOF
